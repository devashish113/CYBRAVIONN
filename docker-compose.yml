services:
  cybravion-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_WEB3FORMS_ACCESS_KEY: ${VITE_WEB3FORMS_ACCESS_KEY:-}
    container_name: cybravion-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    environment:
      - NODE_ENV=production
    depends_on:
      visitor-api:
        condition: service_healthy
    networks:
      - cybravion-net

  visitor-api:
    build:
      context: .
      dockerfile: Dockerfile.visitor
    image: cybravion-visitor-api:latest
    container_name: cybravion-visitor-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
    volumes:
      - ./data:/app/data
    networks:
      - cybravion-net

networks:
  cybravion-net:
    driver: bridge
