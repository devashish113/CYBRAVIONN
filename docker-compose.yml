services:
  cybravion-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_WEB3FORMS_ACCESS_KEY: ${VITE_WEB3FORMS_ACCESS_KEY:-}
    container_name: cybravion-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    environment:
      - NODE_ENV=production
    networks:
      - cybravion-net

networks:
  cybravion-net:
    driver: bridge
