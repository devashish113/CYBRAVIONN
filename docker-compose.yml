services:
  cybravion-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_WEB3FORMS_ACCESS_KEY: ${VITE_WEB3FORMS_ACCESS_KEY:-}
    container_name: cybravion-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    environment:
      - NODE_ENV=production
    depends_on:
      - visitor-api
    networks:
      - cybravion-net

  visitor-api:
    image: node:22-alpine
    container_name: cybravion-visitor-api
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./data:/app/data
      - ./visitor-service.mjs:/app/visitor-service.mjs:ro
    command: ["node", "visitor-service.mjs"]
    networks:
      - cybravion-net

networks:
  cybravion-net:
    driver: bridge
