server {
    listen 80;
    server_name cybravions.com www.cybravions.com _;

    root /usr/share/nginx/html;
    index index.html;

    # Security Hygiene
    server_tokens off;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Enterprise HTTP Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Explicit Cache-Control: NEVER cache index.html at browser or CDN edge
    location = /index.html {
        expires -1;
        add_header Cache-Control "private, no-cache, no-store, must-revalidate, max-age=0, s-maxage=0" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
    }

    # Fingerprinted build assets in /assets/ or matching hash suffixes are safe to cache for 1 year.
    location ^~ /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* '-[A-Za-z0-9_-]{8,}\.(?:css|js|woff2?|eot|ttf|otf)$' {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public files without fingerprints can change in place, so revalidate daily.
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|otf|webp|mp4)$ {
        expires 1d;
        access_log off;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
    }

    # Allow Well-Known Security Files (RFC 9116)
    location ^~ /.well-known/ {
        allow all;
        default_type text/plain;
    }

    # Deny all other hidden files (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Exact, no-trailing-slash URLs map to their prebuilt SEO documents.
    location ~ ^/(about|ai|cyberverse|exception-manager|training|compliance)$ {
        try_files $uri/index.html =404;
        add_header Cache-Control "private, no-cache, no-store, must-revalidate, max-age=0, s-maxage=0" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
    }

    # Serve generated route documents; unknown paths must remain real 404s.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "private, no-cache, no-store, must-revalidate, max-age=0, s-maxage=0" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
    }

    # Custom not-found document, delivered with the original 404 status.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "private, no-cache, no-store, must-revalidate, max-age=0, s-maxage=0" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
    }

    error_page 500 502 503 504 /index.html;
}
